<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumber Land — Employee Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#214596;
    --accent-dark:#162e66;
    --yellow:#ffcc66;
    --ink:#12241a;
    --muted:#7c8a80;
    --line:#e7ebe6;
    --card-bg:#ffffff;
    --page-bg:#eef1ee;
    --row-bg:#f6f8f5;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--page-bg);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}

  .wrap{display:flex;justify-content:center;min-height:100vh;padding:32px 16px;}
  .card{width:100%;max-width:440px;background:var(--card-bg);border-radius:20px;overflow:hidden;box-shadow:0 20px 50px rgba(10,60,35,0.18);height:fit-content;position:relative;}

  .loading-overlay{position:absolute;inset:0;background:#ffffff;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 32px;}
  .loading-overlay img{width:100%;max-width:100px;height:auto;margin-bottom:24px;}
  .loading-text{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;color:var(--ink);margin-bottom:18px;}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .brand{padding:28px 24px 32px;display:flex;align-items:center;justify-content:center;gap:10px;}
  .brand-mark{width:38px;height:38px;border-radius:11px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-mark span{font-family:'Space Grotesk',sans-serif;font-weight:800;color:var(--yellow);font-size:19px;}
  .brand-name{font-family:'Space Grotesk',sans-serif;line-height:1.15;}
  .brand-name b{display:block;font-weight:800;font-size:19px;color:var(--accent);letter-spacing:0.2px;}
  .brand-name small{display:block;font-weight:500;font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-top:1px;}

  .divider{height:4px;background:var(--accent);margin-top:8px;}

  .id-block{padding:0 24px 4px;text-align:center;}
  .avatar{width:104px;height:104px;border-radius:50%;margin:-52px auto 0;background:var(--accent);display:flex;align-items:center;justify-content:center;border:3px solid var(--card-bg);box-shadow:0 6px 18px rgba(0,0,0,0.15);overflow:hidden;}
  .avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;}
  .avatar span{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:32px;color:#fff;}
  .full-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;color:var(--ink);margin-top:14px;}
  .role{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12px;letter-spacing:1.5px;color:var(--accent);text-transform:uppercase;margin-top:4px;}

  .info-grid{padding:20px 24px 4px;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;}
  .info-cell{padding:12px 10px;border-radius:12px;}
  .info-label{font-size:10.5px;letter-spacing:1.3px;color:var(--muted);text-transform:uppercase;font-weight:600;}
  .info-value{font-family:'Space Grotesk',sans-serif;font-size:15px;color:var(--ink);margin-top:4px;}

  .doc-cell{cursor:pointer;background:var(--row-bg);border:1px solid transparent;transition:background .15s ease, transform .1s ease;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .full-span{grid-column:1 / -1;}
  .doc-cell:hover{background:#eef4ee;}
  .doc-cell:active{transform:scale(0.98);}
  .doc-cell .doc-text{min-width:0;}
  .doc-cell .doc-value{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .doc-icon{width:18px;height:18px;flex-shrink:0;color:var(--accent);opacity:.75;}

  .section-sep{margin:22px 24px 0;height:1px;background:var(--line);}

  .section{padding:20px 24px 6px;}
  .section-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;letter-spacing:1.5px;color:var(--accent);text-transform:uppercase;}

  .vehicle-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
  .vehicle-row{display:flex;align-items:center;justify-content:center;background:var(--row-bg);border-radius:12px;padding:14px 12px;cursor:pointer;transition:background .15s ease, transform .1s ease;}
  .vehicle-row:hover{background:#eef4ee;}
  .vehicle-row:active{transform:scale(0.98);}
  .vehicle-plate{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;color:var(--ink);}

  .footer-bar{display:flex;height:28px;}
  .footer-bar div{flex:1;background:linear-gradient(var(--accent), var(--accent) 40%, var(--yellow) 40%, var(--yellow) 60%, var(--accent) 60%);}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(10,25,17,0.55);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:50;}
  .overlay.open{opacity:1;pointer-events:auto;}
  .sheet{width:100%;max-width:440px;background:#fff;border-radius:20px 20px 0 0;padding:20px 20px 28px;transform:translateY(24px);transition:transform .2s ease;max-height:82vh;overflow-y:auto;}
  .overlay.open .sheet{transform:translateY(0);}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;}
  .sheet-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;color:var(--ink);}
  .sheet-close{width:30px;height:30px;border-radius:50%;background:var(--row-bg);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);flex-shrink:0;}
  .sheet-body{margin-top:16px;}
  .doc-preview{width:100%;border-radius:12px;overflow:hidden;background:var(--row-bg);}
  .doc-preview img{width:100%;display:block;}
  .doc-preview iframe{width:100%;height:60vh;border:0;display:block;}
  .empty-state{padding:36px 16px;text-align:center;color:var(--muted);}
  .empty-state svg{width:34px;height:34px;color:var(--muted);opacity:.6;margin-bottom:10px;}
  .empty-state p{font-size:13.5px;line-height:1.5;margin:0;}
  .sheet-sub{font-size:12.5px;color:var(--muted);margin-top:3px;}
  .vehicle-doc-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .vehicle-doc-list .doc-cell{width:100%;}
</style>
</head>

<script>
/* ============================================================
   EDIT THIS SECTION PER EMPLOYEE
   - Set fileUrl on any document/vehicle to a direct link to an
     image (.jpg/.png) or PDF and it will open in the viewer.
   - Leave fileUrl as null until the file is ready — the card
     still works, it just shows "No document on file".
   ============================================================ */

/* ============================================================
   CONNECT TO THE SPREADSHEET
   1. Paste your deployed Apps Script Web App URL below.
   2. Each employee's badge links to this SAME file, with a
      different ?id=EMP0xx at the end of the URL, e.g.:
      https://yoursite.com/profile.html?id=EMP018
   No other part of this file needs to change per employee.
   ============================================================ */

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw6A2TBgcw9LuZuia44zTffwFybTSxEVwQChZgWSixwHFBvPNYhcxBHgsNXyNK64ohN/exec";

/* ============================================================ */

const params = new URLSearchParams(window.location.search);
const employeeId = params.get("id");

let EMPLOYEE = {};
let DOCUMENTS = [];
let VEHICLES = [];

async function loadEmployee(){
  const card = document.querySelector(".card");

  if(!employeeId){
    card.innerHTML = `<div style="padding:48px 24px;text-align:center;color:var(--muted);font-family:'Space Grotesk',sans-serif;">No employee ID provided in the link.</div>`;
    return;
  }
  if(APPS_SCRIPT_URL.indexOf("PASTE_YOUR") === 0){
    card.innerHTML = `<div style="padding:48px 24px;text-align:center;color:var(--muted);font-family:'Space Grotesk',sans-serif;">Apps Script URL not configured yet — see the comment at the top of the script.</div>`;
    return;
  }

  try{
    const res = await fetch(`${APPS_SCRIPT_URL}?id=${encodeURIComponent(employeeId)}&sheet=${encodeURIComponent("Berry Waters")}`);
    const data = await res.json();

    if(data.error){
      card.innerHTML = `<div style="padding:48px 24px;text-align:center;color:var(--muted);font-family:'Space Grotesk',sans-serif;">${data.error}</div>`;
      return;
    }

    EMPLOYEE = {
      name: data.Name,
      role: data.Role,
      nationality: data.Nationality,
      workSite: data.WorkSite,
      photoUrl: data.PhotoURL || null,
    };

    const hasLicense = !!(data.LicenseNumber && String(data.LicenseNumber).trim());

    DOCUMENTS = [
      { key:"passport", label:"Passport Number", value:data.PassportNumber || "N/A", fileUrl:data.PassportFileURL || null, fullSpan:!hasLicense },
    ];
    if(hasLicense){
      DOCUMENTS.push({ key:"license", label:"License Number", value:data.LicenseNumber, fileUrl:data.LicenseFileURL || null });
    }
    DOCUMENTS.push(
      { key:"visa",   label:"Visa Number", value:data.VisaNumber || "N/A", fileUrl:data.VisaFileURL || null },
      { key:"permit", label:"Work Permit Number", value:data.WorkPermitNumber || "N/A", fileUrl:data.WorkPermitFileURL || null }
    );

    VEHICLES = [];
    if(data.Vehicle1Plate){
      VEHICLES.push({
        plate:data.Vehicle1Plate,
        annualFeeUrl:data.Vehicle1AnnualFee || null,
        insuranceUrl:data.Vehicle1Insurance || null,
        roadworthinessUrl:data.Vehicle1Roadworthiness || null,
      });
    }
    if(data.Vehicle2Plate){
      VEHICLES.push({
        plate:data.Vehicle2Plate,
        annualFeeUrl:data.Vehicle2AnnualFee || null,
        insuranceUrl:data.Vehicle2Insurance || null,
        roadworthinessUrl:data.Vehicle2Roadworthiness || null,
      });
    }

    document.getElementById("vehiclesSection").style.display = hasLicense ? "" : "none";

    renderHeader();
    renderInfoGrid();
    renderVehicles();

    document.getElementById("loadingOverlay").style.display = "none";

  } catch(err){
    card.innerHTML = `<div style="padding:48px 24px;text-align:center;color:var(--muted);font-family:'Space Grotesk',sans-serif;">Couldn't load profile data. Please try again.</div>`;
  }
}

/* ============================================================ */

const ICONS = {
  doc: `<svg class="doc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>`,
  empty: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9.5 13.5l5 5m0-5l-5 5"/></svg>`,
};

function initials(name){
  return name.split(" ").filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
}

function isImage(url){ return /\.(png|jpe?g|webp|gif)(\?.*)?$/i.test(url); }
function isPdf(url){ return /\.pdf(\?.*)?$/i.test(url); }
function isDriveLink(url){ return /drive\.google\.com\/file\/d\//.test(url); }

function renderHeader(){
  document.getElementById("fullName").textContent = EMPLOYEE.name;
  document.getElementById("role").textContent = EMPLOYEE.role;
  document.getElementById("avatarInitials").textContent = initials(EMPLOYEE.name);
  if(EMPLOYEE.photoUrl){
    document.getElementById("avatar").innerHTML = `<img src="${EMPLOYEE.photoUrl}" alt="${EMPLOYEE.name}">`;
  }
}

function renderInfoGrid(){
  const grid = document.getElementById("infoGrid");
  const staticCells = [
    { label:"Nationality", value:EMPLOYEE.nationality },
    { label:"Work Site", value:EMPLOYEE.workSite },
  ];

  staticCells.forEach(c=>{
    const el = document.createElement("div");
    el.className = "info-cell";
    el.innerHTML = `<div class="info-label">${c.label}</div><div class="info-value">${c.value}</div>`;
    grid.appendChild(el);
  });

  DOCUMENTS.forEach(doc=>{
    const el = document.createElement("div");
    el.className = "info-cell doc-cell" + (doc.fullSpan ? " full-span" : "");
    el.innerHTML = `
      <div class="doc-text">
        <div class="info-label">${doc.label}</div>
        <div class="info-value doc-value">${doc.value}</div>
      </div>
      ${ICONS.doc}
    `;
    el.addEventListener("click", ()=> openDoc(doc.label, doc.value, doc.fileUrl));
    grid.appendChild(el);
  });
}

function renderVehicles(){
  const list = document.getElementById("vehicleList");
  VEHICLES.forEach(v=>{
    const el = document.createElement("div");
    el.className = "vehicle-row";
    el.innerHTML = `<div class="vehicle-plate">${v.plate}</div>`;
    el.addEventListener("click", ()=> openVehicleMenu(v));
    list.appendChild(el);
  });
}

/* Modal */
const overlay = document.getElementById("overlay");
const sheetTitle = document.getElementById("sheetTitle");
const sheetSub = document.getElementById("sheetSub");
const sheetBody = document.getElementById("sheetBody");

function openDoc(title, sub, url){
  sheetTitle.textContent = title;
  sheetSub.textContent = sub || "";

  if(url){
    if(isDriveLink(url)){
      sheetBody.innerHTML = `<div class="doc-preview"><iframe src="${url}" allow="autoplay"></iframe></div>`;
    } else if(isImage(url)){
      sheetBody.innerHTML = `<div class="doc-preview"><img src="${url}" alt="${title}"></div>`;
    } else if(isPdf(url)){
      sheetBody.innerHTML = `<div class="doc-preview"><iframe src="${url}"></iframe></div>`;
    } else {
      sheetBody.innerHTML = `<div class="doc-preview"><a href="${url}" target="_blank" rel="noopener" style="display:block;padding:16px;text-align:center;color:var(--accent);font-family:'Space Grotesk',sans-serif;font-weight:700;">Open file →</a></div>`;
    }
  } else {
    sheetBody.innerHTML = `
      <div class="empty-state">
        ${ICONS.empty}
        <p>No document on file yet.<br>Add a file link for this field to enable the viewer.</p>
      </div>`;
  }

  overlay.classList.add("open");
}

// Tapping a vehicle opens a menu of its three document tiles (title only,
// no value) — tapping one of THOSE previews that specific document, reusing
// the same openDoc() viewer used for passport/visa/license/permit.
function openVehicleMenu(v){
  sheetTitle.textContent = v.plate;
  sheetSub.textContent = "";

  const fields = [
    { label:"Annual Fee", url:v.annualFeeUrl },
    { label:"Insurance", url:v.insuranceUrl },
    { label:"Roadworthiness", url:v.roadworthinessUrl },
  ];

  sheetBody.innerHTML = `<div class="vehicle-doc-list">${
    fields.map(f => `
      <div class="info-cell doc-cell">
        <div class="doc-text"><div class="info-label">${f.label}</div></div>
        ${ICONS.doc}
      </div>
    `).join("")
  }</div>`;

  Array.from(sheetBody.querySelectorAll(".doc-cell")).forEach((el, i)=>{
    el.addEventListener("click", ()=> openDoc(fields[i].label, "", fields[i].url));
  });

  overlay.classList.add("open");
}

document.getElementById("sheetClose").addEventListener("click", ()=> overlay.classList.remove("open"));
overlay.addEventListener("click", (e)=>{ if(e.target === overlay) overlay.classList.remove("open"); });

loadEmployee();
</script>
